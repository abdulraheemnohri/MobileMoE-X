[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobilemoe-x"
version = "0.2.0"
description = "Small local-first MiniMoE language model and mobile MoE research toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
train = ["torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.5", "torch>=2.2"]

[project.scripts]
mobilemoe = "mobilemoe.cli:main"
mobilemoe-train = "mobilemoe.train:main"
mobilemoe-generate = "mobilemoe.generate:main"
mobilemoe-quantize-model = "mobilemoe.model_quantization:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.package-data]
mobilemoe = ["data/*.json"]
